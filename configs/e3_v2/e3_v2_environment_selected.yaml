    N_active_floor_mean: 0.0
    max_G_over_F_mean: 0.559
    local_failure_ratio_mean: 0.317
    RescueRate_mean: 1.0
    Phase2AcceptRate_tasks_mean: 0.501
    TSSR: "1.0 (3/3 seeds)"
    verdict: "floor 不激活、G/F 有余量、轻载下机制不主导调度"
  TRANSITION_N80:
    N_active_floor_mean: 7.0
    max_G_over_F_mean: 0.815
