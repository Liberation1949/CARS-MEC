# 正确性诊断（admission/RCLA；预期=0，全部满足）
correctness:
  N_ALLOCATION_INFEASIBLE: 0
  max_epsilon_dphi: "1e-16 ~ 1e-15（Lemma 2 精确性，仅浮点误差）"

# 关键发现（如实记录；非缺陷）
findings:
  - id: F1
    text: >
      Phase-2 gate 拒绝全部来自 Delta_Rbar_eff<=-eps（P0 字典序第一维）；
      "持平时需 Delta_U_sys>eps"（utility 分支）在三档 9 runs 中从未触发（rej(U)=0）。
      含义：当前环境 Rbar 变化几乎从不落入 eps 容差；w_no_utility_gate 与 full 变体
      行为可能相同（Q3 的 utility gate 单独辨识可能受限）——E3-V2-2 需如实报告，
      属环境真实属性，不是缺陷（Rbar 门槛在无 deadline 模型下主导，符合正文 P0 字典序）。
  - id: F2
    text: >
      HIGH(N=150) 的 Phase-2 接受率接近 0（seed 203 为 0）：高压下卸载多数使
      Rbar 下降被 P0 字典序拒绝——机制正确表现（高压下 Phase-2 保守），非缺陷。

# 正式运行规格（E3-V2-2 待授权；本阶段不运行）
formal_spec:
  seeds: [401, 402, 403, 404, 405, 406, 407, 408, 409, 410]
  grid: [{N: 20}, {N: 80}, {N: 150}]
  primary_environment: "TRANSITION (N=80)"
  units: [full_cars, w_no_rescue, w_rescue_only, w_no_alloc_aware, w_no_utility_gate,
          fixed_a_rcla, fixed_a_la]
  paired_invariant: "所有 variant 对每个 (seed,N) 使用同一 Scenario 实例；fixed-assignment 同一 X/A hash"
  status: FROZEN_ONLY_NOT_EXECUTED

forbidden:
  - "在 formal seeds 401-410 上运行（本阶段禁止）"
  - "按 Full 获胜幅度选择环境"
  - "重新定义 variant"
  - "修改正式 cars / Contract V3 / Schema V3 / III_VI"
  - "多参数联合调整制造理想结果"
