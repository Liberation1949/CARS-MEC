# E3-V2 环境选择冻结（E3-V2-1 环境识别 Pilot 结论）
# 版本: E3_V2_ENVIRONMENT_SELECTED_V1
# 日期: 2026-08-09
# 依据: configs/e3_v2/e3_v2_environment_definition.yaml（机制触发标准）；
#       results/e3_v2/e3_v2_1_environment_pilot/（9 runs：N{20,80,150} × seeds 201-203）；
#       results/e3_v2/e3_v2_1_environment_summary.json。
# 选择规则: mechanism identifiability（严禁按 Full 获胜幅度选环境）。

environment_selected_version: E3_V2_ENVIRONMENT_SELECTED_V1
generator: scripts/experiments/e3_v2/build_e3_v2_environment.py

selected:
  LOW:        {N: 20, role: "floor 基本不激活 / 轻载机制不主导"}
  TRANSITION: {N: 80, role: "主消融环境（机制覆盖最完整）"}
  HIGH:       {N: 150, role: "capacity stress（G/F 高压、floor 大量激活、仍可服务）"}

PRIMARY_E3_ENVIRONMENT: "TRANSITION"
primary_N: 80

selection_rule: "mechanism identifiability（不得依据 TSSR_Full - TSSR_ablation 选环境）"

# 三档机制识别证据（seeds 201-203 汇总；NOT_FORMAL）
