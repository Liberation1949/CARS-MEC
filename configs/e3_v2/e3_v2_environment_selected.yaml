    N_ALLOCATION_INFEASIBLE: 0
    TSSR: "1.0 (3/3 seeds)"
    verdict: "Phase-1 全触发、Phase-2 接受+拒绝并存、floor 非零非饱和、未不可服务——机制覆盖最完整、跨 3 seeds 最稳定"
  HIGH_N150:
    N_active_floor_mean: 17.0
