# E0-V2-0 阶段合同：新版 E0 实验协议冻结（协议与工具底座）
# 版本: E0_V2_PROTOCOL_V1
# 日期: 2026-08-09
# 状态: FROZEN_ONLY_TOOLS（本阶段只冻结协议与工具；Pilot/Formal 不运行）
# 依据: 用户 2026-08-09 E0 目的与设计（现象识别实验，非性能排名）；
#       正文 III_VI.md III-E.3/4/5、III-F.1/2/3、VI-E.2、VI-F.1；
#       E3-V2 冻结（configs/e3_v2/* 环境/字段/协议；候选 cars_redesign 实现）。

# ---------------------------------------------------------------------------
# 0. 阶段定义
# ---------------------------------------------------------------------------
stage_id: E0_V2_0
stage_name: "E0 协议与工具冻结（新版 AADA-RCLA 语义）"
stage_goal: >
  冻结新版 E0 的机器可读实验协议与工具底座：环境生成器（嵌套任务/前缀一致）、
  指标两层字段定义、Pilot runner 骨架、冻结测试与人工微型案例。
  本阶段不运行 Pilot/Formal（E0-V2-1/E0-V2-2 待授权）。
workflow: "Freeze -> Confirm -> Execute -> Test -> Review -> Return -> Stop"
authorized: false          # E0-V2-0 已授权（用户 2026-08-09）；Pilot/Formal 未授权
next_stage: E0_V2_1        # Pilot（不自动进入）

# ---------------------------------------------------------------------------
# 1. E0 定位（用户冻结；现象识别实验）
# ---------------------------------------------------------------------------
e0_positioning:
  type: "phenomenon identification（现象识别实验，不是性能排名实验）"
  not_responsible: "证明 AADA-RCLA 全面优于所有 baseline（那是 E1）"
  purpose_statement_en: >
    E0 investigates how increasing workload induces service degradation through
    finite-capacity resource competition, determines whether the resulting degradation
    exhibits an accelerated collapse-like regime, and evaluates whether AADA-RCLA
    mitigates or delays such degradation.
  purpose_statement_zh: >
    E0 通过逐步增加系统负载，刻画有限容量竞争诱发的服务退化过程，判断其是否进一步
    形成持续加速恶化的坍缩形态，并检验 AADA-RCLA 能否缓解该退化过程或推迟可能出现的
    加速恶化区间。
  three_questions:
    - Q1: "负载增加是否造成系统性服务退化（N↑ -> contention↑ -> f_ij↓ -> R_i↓ -> TSSR/Rbar/Ubar↓）"
    - Q2: "普通退化是否演变成持续加速恶化（possible accelerated collapse）——不预设坍缩存在"
    - Q3: "AADA-RCLA 是否缓解/推迟退化（面对相同负载增长退化更慢）"
  mechanism_chain: >
    N↑ -> capacity competition↑ -> f_ij↓ -> R_i↓ -> Rbar_eff/Ubar_eff/TSSR↓；
    AADA-RCLA 是否削弱这条退化链。λ_j 固定名义故障率，不随负载变化。

# ---------------------------------------------------------------------------
# 2. 实验环境（唯一自变量 N；M=8 固定；沿用 E3-V2 generator/config）
# ---------------------------------------------------------------------------
environment:
  description: "snapshot-based MU-MEC；8 台异构服务器、全连接"
  independent_variable: N        # 唯一自变量：任务数
  servers_m: 8
  topology: fully_connected
  generator_reuse: "E3-V2 同一 Scenario generator/config（服务器先行 + 前缀一致性）"
  structure:
    compute_tiers: [[2000, 0.4], [5000, 0.4], [12000, 0.2]]
    device_tiers: [[800, 0.5], [1200, 0.5]]
    server_base: 10000
    server_heterogeneity: "F_j = 10000 * (1 + 0.3 * (j mod 3))"
    fragility_tiers: [[0.0, 0.4], [8.0, 0.3], [16.0, 0.3]]
    lambda_loc: 0.002
    lambda_j: "U[0.001, 0.003]"
    r_min: "U[0.85, 0.95]"
    deadline: "无 deadline 模型（deadline_seconds 占位字段，逻辑不使用）"
    system_params: "只 kappa_R（无 deadline 模型）"
  compute_scale: 1.0
  nested_tasks:  # 用户设计：嵌套任务（小规模是最大规模的任务前缀/固定子集）
    rule: "每个 seed 一次生成 N_max；Gamma_20 ⊂ Gamma_50 ⊂ ... ⊂ Gamma_Nmax"
    servers_links_sampling: "服务器/信道/任务属性采样规则一致（只依赖 seed）"
    why: "同 seed 下 N↑ 是真'增加 workload'，利于曲线斜率与 paired 统计"
  n_max: 260     # Pilot 网格最大 N（每 seed 生成一次，prefix 到各 N）

# ---------------------------------------------------------------------------
# 3. Pilot 网格（E0-V2-1；NOT_FORMAL；本阶段只登记）
# ---------------------------------------------------------------------------
pilot:
  n_grid: [20, 40, 60, 80, 100, 120, 150, 180, 220, 260]
  seeds: [201, 202, 203, 204, 205]
  seeds_status: NOT_FORMAL
  methods: [reliability_only, bpso_rata_la, cars_aada_rcla_candidate]
  diagnostic_methods: [local_only]   # 只作诊断控制，不进主图；可选附录/表一行
  purpose: "找到四区域：Stable -> Transition -> Degraded -> Near-unserviceable"
  allowed_adjustment: "只可调整 N 覆盖范围一次"
  forbidden_adjustment:
    - "调算法参数"
    - "为制造 collapse 修改任务分布"
    - "在 formal seeds 上运行"
  keep_at_least: [20, 80, 150]   # E3 已证明有压力意义的三个锚点优先保留
  total_runs_estimate: "10 N x 5 seeds x 4 methods = 200 runs"

# ---------------------------------------------------------------------------
# 4. Formal 网格（E0-V2-2；pilot 后看正式结果前冻结；本阶段只登记原则）
# ---------------------------------------------------------------------------
formal:
  grid_principle: "pilot 之后、正式结果之前冻结；覆盖低负载/过渡/明显退化区域"
  n_points: 7
  candidate_grid_a: [20, 50, 80, 110, 140, 170, 200]
  candidate_grid_b: [20, 50, 80, 110, 150, 200, 250]   # 若 AADA-RCLA 在 N=200 仍几乎完全稳定则右移
  grid_selection_rule: "由 E0-V2-1 pilot 按负载响应曲线形态冻结（不预先规定必须用哪组）"
  seeds: [601, 602, 603, 604, 605, 606, 607, 608, 609, 610,
          611, 612, 613, 614, 615, 616, 617, 618, 619, 620]
  seeds_status: NEW_PAIRED_UNSEEN   # 与 E3-V2 401-410、旧 E3 301-305 全互斥
  paired_invariant: "所有方法对每个 (seed, N) 使用完全相同的 (tasks, servers, links)"
  methods: [reliability_only, bpso_rata_la, cars_aada_rcla_candidate]
  diagnostic_methods: [local_only]
  total_runs: 420   # 3 x 7 x 20
  status: REGISTERED_ONLY_NOT_EXECUTED

# ---------------------------------------------------------------------------
# 5. 方法（共享 scenario/seed/physical model/Evaluator/timeout；公平边界）
# ---------------------------------------------------------------------------
methods:
  cars_aada_rcla_candidate:
    role: "本文完整方法（AADA-RCLA）"
    config_source: "configs/cr_algorithm_redesign/candidate_v1.yaml（aada_variant=full, allocation_mode=rcla）"
    run_mode: "候选直接实例化（AADARCLACandidate + MethodContext；不在正式 Registry）"
    e0_role: "检验 allocation-aware assignment + reliability-constrained allocation 是否使负载—服务曲线退化更缓"
  bpso_rata_la:
    role: "E0 最重要的强基线"
    config_source: "configs/r6/frozen_method_configs/bpso_frozen.yaml"
    run_mode: "统一 MethodRunner（R5 公平边界）"
    e0_role: "结构上与 AADA-RCLA 可比（offloading/assignment + LA allocation）；RCLA 无 floor 激活时精确退化为普通 LA"
  reliability_only:
    role: "机制诊断基线"
    config_source: "configs/r6/frozen_method_configs/reliability_only_frozen.yaml"
    run_mode: "统一 MethodRunner（R5 公平边界）"
    e0_role: "无 AADA downstream-allocation awareness 与 RCLA floor，暴露 reliability-oriented scheduling 在容量压力下的典型行为"
  local_only:
    role: "诊断控制（不入主图；可选附录/表一行）"
    config_source: "configs/r6/frozen_method_configs/local_only_frozen.yaml"
    run_mode: "统一 MethodRunner（R5 公平边界）"
    e0_role: "不使用共享边缘资源时 N↑ 是否也出现边缘资源竞争现象"
  excluded_from_e0: [jtora_adapted, nfa_adapted, foa]   # 属于 E1/E2 完整横向比较
  fairness:
    shared: [scenario, seed, raw-data split, derived-data rules, hard constraints,
             Evaluator, formal-test, timeout policy, hardware budget, failure accounting]
    timeout_seconds: 30.0     # R6 冻结 shared timeout
    evaluator: "统一 Evaluator 唯一正式评价（所有方法同源）"
  forbidden_metrics: [V_D, deadline_violation_rate, lambda_eff, Q_j, Z_j, ruad_gamma, gamma]

# ---------------------------------------------------------------------------
# 6. 指标（两层；正文核心 + 机制诊断）
# ---------------------------------------------------------------------------
metrics:
  primary_outcome: TSSR
  core_metrics:          # 正文核心（优先级 TSSR > Rbar_eff > Ubar_eff；与第四章 TSSR-first lexicographic 一致）
    - TSSR
    - Rbar_eff
    - Ubar_eff
    - V_R
  mechanism_metrics:     # 机制诊断（正文重点只需 V_F 与 max G/F；其余进 raw JSON/CSV）
    - V_F                 # resource-underfloor ratio（正文重点）
    - chi_ij              # normalized reliability-resource adequacy = f_ij / ell_R_ij
    - median_f_over_ellR  # median(f/ell^R)
    - max_G_over_F        # max_j G_j/F_j（正文重点）
    - LI_dem              # demand load imbalance（正文 III-E.5）
    - edge_ratio          # |Gamma_edge| / N
  metric_priority: "TSSR > Rbar_eff > Ubar_eff"
  v_r_definition: "V_R = |{i : R_i < R_i^min, e_i=1}| / N（正文 III-E.4；只统计结构与容量可评价任务）"
  v_f_definition: >
    V_F = |{i in Gamma_edge : f_ij < ell_R_ij}| / |Gamma_edge|
    （resource-underfloor ratio；Gamma_edge = {i : x_i=1} 卸载任务集合；
    ell_R_ij 取公共 DerivedState edge.ell_R，F-16 语义；无 deadline 下 ell_succ=ell_R）
  chi_definition: "chi_ij = f_ij / ell_R_ij（chi < 1 表示计算资源低于可靠性成功所需阈值）"
  max_G_over_F_definition: "rho_j^R = G_j/F_j = sum_{i in Gamma_j} ell_R_ij / F_j；取 max_j"
  edge_ratio_definition: "|Gamma_edge| / N（卸载任务比例）"
  mechanism_chain: "N↑ -> V_F↑ -> V_R↑ -> TSSR↓（floor pressure -> under-allocation -> reliability violation -> TSSR degradation）"

# ---------------------------------------------------------------------------
# 7. 坍缩判断协议（禁止固定阈值；两层判断 + segmented regression + bootstrap）
# ---------------------------------------------------------------------------
collapse_judgment:
  forbidden: "固定 collapse threshold / 固定 collapse index / 固定边界公式（正文 III-F.2 禁止）"
  step1_curve_inspection: "观察 load-response 曲线 y(N)；比较 early-load slope vs late-load slope"
  step1_trigger: "|s_late| > |s_early| 且在多个连续点、多个 seeds 上稳定出现"
  step2_segmented_regression: >
    y(N) = { a1 + b1*N, N <= Nc; a2 + b2*N, N > Nc }；
    给出 Nc 的 bootstrap 95% CI（segmented fit）
  verdict:
    - "证据不足 -> ordinary degradation"
    - "明确持续加速 -> accelerated degradation regime（此时 Nc 只称 empirical onset，不是理论 collapse threshold）"
  claim_boundary: "正文 VI-E.2 F3/F7/F8 + III-F.3（禁止 prevent/eliminate/guarantee no collapse）"

# ---------------------------------------------------------------------------
# 8. 正文产出预算（E0-V2-MANUSCRIPT；本阶段只登记）
# ---------------------------------------------------------------------------
manuscript_budget:
  figures: 2
  tables: 1
  fig_e0_1:
    name: "Load-response curves"
    panels:
      - "(a) TSSR vs N"
      - "(b) Rbar_eff vs N"
      - "(c) Ubar_eff vs N"
    lines: [reliability_only, bpso_rata_la, cars_aada_rcla_candidate]
  fig_e0_2:
    name: "Mechanism evidence"
    panels:
      - "(a) V_R vs N"
      - "(b) V_F vs N"
      - "(c) max_j G_j/F_j vs N（版面允许时）"
  table_e0_1:
    name: "退化/坍缩总结"
    columns: [Method, Early TSSR slope, Late TSSR slope, Slope ratio, "Empirical onset (Nc)",
              "TSSR@max(N)", "V_R@max(N)", "V_F@max(N)", Conclusion]
    no_onset_text: "Ordinary degradation; no stable accelerated regime identified.（Nc=N/A）"

