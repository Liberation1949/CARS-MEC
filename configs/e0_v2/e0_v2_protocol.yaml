    - "修改正式 cars / Contract V3 / Schema V3 / III_VI"
    - "调整算法参数 / 修改任务分布制造 collapse"
    - "引入旧语义指标（V_D/deadline/gamma/Q/Z/lambda_eff）"
    - "定义固定 collapse threshold"

# ---------------------------------------------------------------------------
# 10. AC（本阶段验收）
# ---------------------------------------------------------------------------
acceptance_criteria:
  AC-1: "e0_v2_protocol.yaml 覆盖环境/Pilot/Formal/方法/指标/坍缩判断/图表/禁止项全部冻结项"
  AC-2: "e0_v2_field_definitions.yaml 定义全部主指标与机制指标（含 V_F/chi/max G/F 口径与来源）"
  AC-3: "build_e0_v2_environment 通过前缀一致性 + 确定性 + 嵌套链（Gamma_20⊂...⊂Gamma_260）测试"
  AC-4: "run_e0_v2_pilot 在微型场景冒烟可运行；统一 Evaluator 唯一评价；V_F/chi/LI_dem/edge_ratio 输出合法"
  AC-5: "V_R/V_F/chi/LI_dem/edge_ratio 与人工微型案例手算一致（Oracle 独立推导）"
  AC-6: "旧语义字段（V_D/deadline/gamma/Q/Z/lambda_eff）被配置校验拒绝"
  AC-7: "全量 pytest 无新增失败（既有 W55 71 failed/702 passed 不变）"
  AC-8: "保护对象 hash 不变（experiment_docs/references/data/src/schemas/既有 configs）"
  AC-9: "未运行 Pilot/Formal；formal seeds 601-620 未访问"
  AC-10: "阶段报告 + integrity JSON 完整；P0=0；P1=0"

# ---------------------------------------------------------------------------
# 11. P0 / P1（本阶段）
# ---------------------------------------------------------------------------
p0:
  - "保护对象实际损坏或不可读"
  - "核心工具（生成器/runner）无法运行"
p1:
  - "前缀一致性被破坏（嵌套任务链失效）"
  - "V_F/chi 指标口径与正文/用户设计冲突"
  - "统一 Evaluator 未被唯一使用"
  - "旧语义字段泄漏进协议/代码"
  - "形式化测试失败（本阶段冻结测试）"
  - "保护对象被未经授权修改"

# ---------------------------------------------------------------------------
# 12. 停止条件 / 完成定义 / 最大轮数
# ---------------------------------------------------------------------------
stop_conditions:
  - "发现 MANUSCRIPT_HARD_CONFLICT"
  - "需要修改保护对象但无批准"
  - "出现真实 P0/P1 且无法在合同内修复"
  - "用户撤回授权"
completion_definition: "mandatory 完成 + 冻结测试通过 + 完整性检查通过 + 核心产物可运行 + P0=0 + P1=0"
max_rounds: 2
round2_scope: "仅修复原合同内有直接证据、可复现、可定位且具有实质影响的真实 P0/P1"
return_status: "PASS / PASS_WITH_WARNINGS / FAIL_AND_REDESIGN"

