    - scripts/experiments/e0_v2/build_e0_v2_environment.py
    - scripts/experiments/e0_v2/run_e0_v2_pilot.py
    - tests/e0_v2/test_e0_v2_configs.py
    - tests/e0_v2/test_e0_v2_environment.py
    - tests/e0_v2/test_e0_v2_metrics.py
    - tests/e0_v2/test_e0_v2_methods_smoke.py
    - reports/experiments/E0_V2_0_protocol_freeze.md
    - results/e0_v2/e0_v2_0_integrity.json
  allowed_modify:
    - configs/e0_v2/**        # 新建
    - scripts/experiments/e0_v2/**  # 新建
    - tests/e0_v2/**           # 新建
    - results/e0_v2/**         # 新建（本阶段只写协议/工具证据）
    - reports/experiments/     # 本阶段报告
  read_only_reuse:
    - configs/e3_v2/**         # E3-V2 冻结（只读复用）
    - configs/r6/frozen_method_configs/**  # Baseline frozen configs（只读）
    - configs/cr_algorithm_redesign/candidate_v1.yaml  # 候选配置（只读）
    - src/cars/**              # 公共底座/候选实现/方法（只读）
    - scripts/experiments/e3_v2/build_e3_v2_environment.py  # 生成器（只读复用）
  forbidden:
    - "修改 experiment_docs / references / data（保护对象）"
    - "修改 src / schemas / tests（既有）/ configs（非 e0_v2 白名单）"
    - "运行 Pilot / Formal（AUTHORIZED=NO）"
