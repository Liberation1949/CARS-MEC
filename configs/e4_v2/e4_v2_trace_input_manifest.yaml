  - "设备参数（f_i^loc、λ_i^loc、κ_i、p_i）"
  - "链路参数（B_ij、h_ij、σ²、p_ij^err）"
  - "任务参数（c_i、d_i、ν_i、α_i、β_i、R_i^min）"
  - "M=8 服务器数与拓扑"
legacy_model_fields_present: false   # 数据中不含 deadline/lambda_eff/ruad/cala/repair 等旧模型字段

