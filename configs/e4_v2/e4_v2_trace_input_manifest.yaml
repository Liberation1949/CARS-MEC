# 6. 归一化与预处理 provenance（既有冻结预处理；只确认，不重算）
# ---------------------------------------------------------------------------
preprocessing_provenance:
  rule: workload_intensity = clip((x - P5) / (P95 - P5), 0, 1)
  p5_p95_source: 仅从 calibration 分区计算（azure/shanghai 的 workload_intensity；nep 因全 0 无归一化）
  verified_mismatches: 0（抽样 2000 条 calibration 记录逐条复核，与 splits 值一致）
  azure: {P5: 2603302.0, P95: 3558447.0, n_samples: 2822}
  shanghai: {P5: 428.0, P95: 1287.0, n_samples: 3070}
  nep_workload: NOT_AVAILABLE（P5=P95=0.0；无 workload 信号）
  nep_cpu_pressure_stats: {P5: 0.059971, P95: 0.106358, n_samples: 10727, min: 0.05718, max: 11.286683}
  aggregation: {azure: 5min, nep: 5min, shanghai: 60min}
  raw_counts: {azure: 14 files / slots_per_file 288, nep: 276268767 rows / 136 sites, shanghai: 6952921 rows / 12 files}
  year_note: "shanghai 数据为 2014 年（非 2019）——既有预处理 stats 已注明，可作 temporal pattern 使用"
  provenance_gap: >
    仓库内不存在生成这些 processed 文件的预处理脚本（greenfield 重建后未保留）；
    仅以目录内 preprocessing_stats / split_manifest / split_summary 作为既有 provenance。
    本阶段不重新执行任何预处理。

# ---------------------------------------------------------------------------
# 7. 数据真实成分 vs 合成/固定成分（E4 语义边界）
# ---------------------------------------------------------------------------
real_components:
  - "时间戳/timestamp（真实观测时间顺序）"
  - "request_count / user_count / workload_intensity（azure/shanghai 真实负载观测）"
  - "cpu_pressure / region_id / hotspot_distribution（NEP 真实观测）"
synthetic_or_fixed_components:
