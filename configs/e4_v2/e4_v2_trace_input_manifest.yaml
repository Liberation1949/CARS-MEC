# ---------------------------------------------------------------------------
# 3. 统一字段列表（三数据集共享；16 字段）
# ---------------------------------------------------------------------------
fields:
  - field: dataset_id
    unit: enum
    description: 数据集标识（azure/nep/shanghai）
  - field: trace_segment_id
    unit: enum
    description: 时间分段标识（azure 按日 d01..d14；nep 按日 20200601..；shanghai 按年月 201405..）
  - field: slot_id
    unit: enum
    description: 槽唯一标识（{dataset}_slot_{n} 或 {dataset}_slot_{unix}）
  - field: timestamp
    unit: ISO-8601 datetime（本地时区；无时区后缀）
    description: 槽起始时间（决定时间顺序与 window 边界）
  - field: request_count
    unit: 请求数/槽
    description: 槽内请求数（azure=调用数；shanghai=请求数；nep 全 0 = NOT_AVAILABLE）
  - field: user_count
    unit: 用户数/槽
    description: 槽内活跃用户数（shanghai 真实；azure/nep 全 0 = NOT_AVAILABLE）
  - field: workload_intensity
    unit: 原始=数据集原生单位（azure 调用数 / shanghai 用户数 / nep 无）；splits 内=归一化 [0,1]
    description: 负载强度（raw trace_slots 为原生单位；splits/*.jsonl 为 clip((x-P5)/(P95-P5)) 归一化）
  - field: burst_score
    unit: dimensionless
    description: 突发性分数——全数据集恒为 0.0，判定为占位字段（无真实 burstiness 证据）；E4 登记 NOT_AVAILABLE
  - field: cpu_pressure
    unit: ratio_0_1（NEP 标注；超出 [0,1] 的异常值仅 NEP max=11.29 属原始异常保留）
    description: CPU 压力（仅 NEP 真实；azure/shanghai 全 null）
  - field: memory_pressure
    unit: 未知（数据中全部 null）
    description: 内存压力（三数据集全部 null = NOT_AVAILABLE）
  - field: bandwidth_state
    unit: 未知（数据中全部 null）
    description: 带宽状态（三数据集全部 null = NOT_AVAILABLE）
  - field: rtt_state
    unit: 未知（数据中全部 null）
    description: 往返时延状态（三数据集全部 null = NOT_AVAILABLE）
  - field: region_id
    unit: enum
    description: 区域标识（NEP=站点名；shanghai=经纬度小区；azure 全 null）
  - field: hotspot_distribution
    unit: JSON dict（区域->占比，字符串编码）
    description: 热点分布（仅 NEP 真实；azure/shanghai 全 null）
  - field: missing_field_flags
    unit: JSON 数组（字符串编码）
    description: 缺失字段标记——三数据集全部为 "[]"（无记录级缺失标记）
  - field: raw_source_hash
    unit: 16-hex
    description: 每条记录的原始来源 hash（既有预处理生成，仅溯源用途）

