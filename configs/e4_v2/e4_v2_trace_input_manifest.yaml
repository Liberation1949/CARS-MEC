  azure: time_ordered=True（2019-01-01T00:00:00 -> 2019-01-14T23:55:00）
  nep: time_ordered=True（2020-06-01T00:00:00 -> 2020-06-30T23:55:00）
  shanghai: time_ordered=True（2014-05-31T23:00:00 -> 2014-11-30T23:00:00）
missing_records: 未发现（missing_field_flags 全 "[]"；无记录级缺失标记）

