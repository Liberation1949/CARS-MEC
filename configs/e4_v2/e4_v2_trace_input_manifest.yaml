  nep: {calibration: 5364, pilot: 1149, formal: 1150}
  shanghai: {calibration: 3070, pilot: 658, formal: 659}
  partition_checks:
    - "split ⊆ raw（每数据集 split slot_id 集合均为 raw 子集）：PASS"
    - "calibration ∩ pilot = 0；calibration ∩ formal = 0；pilot ∩ formal = 0：PASS"
    - "时间顺序：calibration < pilot < formal（无交错）：PASS"
  split_files:
    azure: [splits/azure/azure_calibration.jsonl, splits/azure/azure_pilot.jsonl, splits/azure/azure_formal.jsonl]
    nep: [splits/nep/nep_calibration.jsonl, splits/nep/nep_pilot.jsonl, splits/nep/nep_formal.jsonl]
    shanghai: [splits/shanghai/shanghai_calibration.jsonl, splits/shanghai/shanghai_pilot.jsonl, splits/shanghai/shanghai_formal.jsonl]

