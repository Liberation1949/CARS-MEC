# E1-V2-0 冻结环境（E1_V2_ENVIRONMENT_SELECTED_V1）
# 版本: E1_V2_ENVIRONMENT_SELECTED_V1
# 日期: 2026-08-09
# 阶段: E1-V2-0（Environment Calibration and Freeze；用户 2026-08-09 授权）
# 状态: FROZEN（正式 E1 workload grid 的权威环境；除 N 与 seed 外全部固定）
# 选择依据: AC-E1-ENV-1..5 + 确定性 tie-break（E1-V2-0 校准协议 §6）——
#           NOT based on CARS rank。

environment:
  id: E1_V2_ENVIRONMENT_SELECTED_V1
  s_f: 1.00
  fragility_profile: MEDIUM
  m: 8
  topology: "fully connected"
  compute_scale: 1.0
  task_compute_tiers: [[2000, 0.4], [5000, 0.4], [12000, 0.2]]
  fragility_tiers: {0: 0.4, 8: 0.3, 16: 0.3}   # V-MEDIUM（= E1_ENVIRONMENT_V1 默认）
  device_tiers: [[800, 0.5], [1200, 0.5]]
  server_base_capacity: 10000
  server_capacity_rule: "F_j = 10000 * (1 + 0.3 * (j mod 3)) * s_F（s_F=1.00）"
  server_lambda: "U[0.001, 0.003]（固定名义故障率；不随 workload/校准改变）"
  local_failure_rate: 0.002
  min_reliability: "U[0.85, 0.95]"
  deadline: "无 deadline 模型（deadline_seconds 占位 1000.0，逻辑不使用）"
  system_params: >
    Schema V4（rcla_solver: rcla_mu_tol=1e-9/rcla_max_iters=200/rcla_mu_lo=1e-12/
    rcla_mu_hi=1e12/rcla_numeric_epsilon=1e-12；numeric_epsilon=1e-12）
  nested_generation: >
    每个 seed 先生成 Gamma_200（确定性 RNG(seed)；服务器先行，对全部 N 前缀固定）；
    任意 N<=200 用 deterministic nested prefix（Gamma_20 ⊂ Gamma_50 ⊂ ... ⊂
    Gamma_200）；除 N 外环境参数不得变化。

formal_grid: [20, 50, 80, 110, 140, 170, 200]
zones:
  LOW: [20, 50]
  TRANSITION: [80, 110, 140]
  HIGH: [170]
  NEAR_SATURATION: [200]
zone_basis: >
  （决策前压力 + 所有方法整体响应；E1-V2-0 confirmatory 5 seeds）：
  d/c ratio（aggregate_min_floor_demand / total_capacity，5-seed mean）：
  N=20 0.096 / N=50 0.243 / N=80 0.423 / N=110 0.564 / N=140 0.734 /
  N=170 0.911 / N=200 1.050。
  LOW：d/c<=0.25、TSSR≈1 轻载；TRANSITION：0.42-0.73 方法开始分化；
  HIGH：0.91 高压可服务；NEAR-SATURATION：1.05 接近饱和仍可服务
  （cars@200=0.955/nfa@200=0.922，未崩溃）。

formal_seeds: [1101, 1102, 1103, 1104, 1105, 1106, 1107, 1108, 1109, 1110]
timeout_seconds: 30.0

# ---------------------------------------------------------------------------
# 选择依据（AC-E1-ENV-5 明确性证明；NOT based on CARS rank）
# ---------------------------------------------------------------------------
selection_basis:
  not_based_on_cars_rank: true
  layer_a_primary: true
  workload_coverage: "LOW(20,50) / TRANSITION(80,110,140) / HIGH(170) / NEAR-SATURATION(200) 四区完整"
  identifiability: "confirm 5 seeds：cars/nfa TSSR 高（@200 0.955/0.922），bpso/rel 明显低（@200 0.763/0.779）——方法可辨识，非全 ceiling/全 collapse"
  no_ceiling: "N=200 bpso 0.763/rel 0.779 明显下降（非全部 TSSR≈1）"
  no_collapse: "N=200 cars 0.955/nfa 0.922（未大面积接近 0）；preinf=0 全程"
  no_grid_adjustment_required: "N=200 未大面积不可服务（规则 A 不触发）；未全部 ceiling（规则 B 不触发）——formal grid 保持 {20,50,80,110,140,170,200}"
  tie_break_applied:
    - "与已有 E0/E3/E1-pilot 公共环境尺度完全一致（s_F=1.0 + V-MEDIUM 默认 ν）——tie-break 4/5 最强"
    - "方法无关压力梯度平滑（d/c 0.096→1.050 单调）——tie-break 2/3"
  rejected_candidates_note: "全部 9 候选校准 attempts 完整保存于 results/e1_v2/e1_v2_0_calibration（见报告）"

# ---------------------------------------------------------------------------
# 校准证据（confirmatory 5 seeds mean；完整见 calibration_raw.jsonl）
# ---------------------------------------------------------------------------
confirmatory_evidence:
  seeds: [704, 705, 706, 707, 708]
  demand_capacity_ratio_by_n: {20: 0.0959, 50: 0.2425, 80: 0.4226, 110: 0.5641, 140: 0.7335, 170: 0.9108, 200: 1.0495}
  mean_tssr_by_n:
    cars: {20: 1.0, 50: 1.0, 80: 1.0, 110: 0.9964, 140: 0.9871, 170: 0.9682, 200: 0.955}
    bpso_rata_la: {20: 0.94, 50: 0.88, 80: 0.845, 110: 0.8127, 140: 0.7729, 170: 0.7659, 200: 0.763}
    nfa_adapted: {20: 1.0, 50: 1.0, 80: 1.0, 110: 1.0, 140: 0.9843, 170: 0.9471, 200: 0.922}
    reliability_only: {20: 1.0, 50: 0.956, 80: 0.8925, 110: 0.8455, 140: 0.8086, 170: 0.7824, 200: 0.779}
  timeout_count: 0
  method_error_count: 0
  note: "本表为环境校准证据（Layer B sanity）；CARS 排名未进入环境评分（AC-E1-ENV-5）；正式性能结论以 E1-V2-1 Formal 为准。"
